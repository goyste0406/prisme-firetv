<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, user-scalable=no">
<title>prisme</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Outfit:wght@200;300;400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap">
<style>
/* Layout: salon sombre, téléviseur 16:9 rendu en 1280×720 natif puis mis à l'échelle, télécommande Fire TV à droite */
:root{
  --room:#0b0c10; --room2:#14161d; --ink:#eef0f5; --muted:#8b90a0;
  --glass:rgba(255,255,255,.10); --glass-b:rgba(255,255,255,.14);
  --focus:#ffffff; --live:#ff3b30; --ok:#34c759; --accent:#0a84ff;
  --ui:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Outfit",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--room2),var(--room) 70%);color:var(--ink);font-family:var(--ui)}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px;max-width:1440px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:16px}
.top h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.top p{margin:0;color:var(--muted);font-size:13px}
.stage{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.tvwrap{flex:1 1 640px;min-width:0;max-width:1120px}
.tv{background:#050506;padding:10px;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px #1d1f26 inset}
.tv-inner{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:3px;background:#000}
.stand{width:22%;height:14px;margin:0 auto;background:linear-gradient(#16181e,#0c0d11);border-radius:0 0 10px 10px}
.hint{color:var(--muted);font-size:13px;line-height:1.6;margin:18px auto 0;max-width:900px;text-align:center}
kbd{font-family:var(--ui);font-size:12px;background:#1c1f27;border:1px solid #2a2e39;border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink)}

/* Télécommande */
.remote{width:118px;flex:0 0 auto;background:linear-gradient(160deg,#2a2b30,#141518);border-radius:60px;padding:26px 14px 34px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
.rb{appearance:none;border:0;background:#0f1013;color:#cfd2da;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 3px rgba(0,0,0,.5)}
.rb:active{transform:scale(.94);background:#1c1e24}
.rb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rb svg{width:16px;height:16px;fill:currentColor}
.mic{background:#20476e;color:#fff}
.dpad{position:relative;width:96px;height:96px;border-radius:50%;background:#0f1013;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 3px 5px rgba(0,0,0,.5)}
.dpad .rb{position:absolute;background:transparent;box-shadow:none;width:30px;height:30px}
.dpad .u{top:2px;left:33px}.dpad .d{bottom:2px;left:33px}.dpad .l{left:2px;top:33px}.dpad .r{right:2px;top:33px}
.dpad .ok{left:24px;top:24px;width:48px;height:48px;background:#1b1d22;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);font-size:11px;font-weight:600}
.rrow{display:flex;gap:10px}
.brand-r{font-size:10px;letter-spacing:.2em;color:#5c606c;margin-top:4px}

/* Écran TV (1280×720) */
#scr{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;font-family:var(--ui);color:#fff;background:#000;-webkit-font-smoothing:antialiased}
#bg,#bg>div{position:absolute;inset:0}
.bgl{transition:opacity .7s ease;opacity:0;background-size:cover}
.bgl.on{opacity:1}
.shade{background:linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.1) 100%),linear-gradient(0deg,rgba(0,0,0,.85) 0%,transparent 60%)}
#view{position:absolute;inset:0}
.foc{outline:none}

/* Barre d'onglets tvOS */
.tabbar{position:absolute;top:26px;left:0;right:0;display:flex;justify-content:center;z-index:5;pointer-events:none}
.tabs{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:40px;background:rgba(40,40,48,.45);backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);border:1px solid rgba(255,255,255,.1)}
.tab{height:44px;padding:0 24px;border-radius:30px;display:flex;align-items:center;font-size:21px;font-weight:500;color:rgba(255,255,255,.72);cursor:pointer;transition:all .18s}
.tab.ic{padding:0 16px}.tab svg{width:22px;height:22px;fill:currentColor}
.tab.sel{background:rgba(255,255,255,.2);color:#fff}
.tab.foc{background:#fff;color:#000;transform:scale(1.08);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.brand{position:absolute;left:56px;top:36px;z-index:5;font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,#ff375f,#ff9f0a,#30d158,#0a84ff,#bf5af2,#ff375f);display:inline-block}
.clock{position:absolute;right:56px;top:36px;z-index:5;font-size:22px;font-weight:500;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums}

/* Héro (aperçu de l'élément focalisé) */
.hero{position:absolute;left:64px;top:108px;width:700px;height:268px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.kick{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.ttl{margin:0;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.4);text-wrap:balance}
.hero .ttl{max-height:170px;overflow:hidden}
.ttl.f-bebas{font:400 86px/.92 "Bebas Neue",var(--ui);letter-spacing:.02em}
.ttl.f-serif{font:italic 700 62px/1 "Playfair Display",Georgia,serif}
.ttl.f-black{font:400 54px/1 "Archivo Black",var(--ui);text-transform:uppercase}
.ttl.f-thin{font:200 60px/1 "Outfit",var(--ui);text-transform:uppercase;letter-spacing:.14em}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:18px;color:rgba(255,255,255,.82)}
.badge{font-size:13px;font-weight:700;border:1.5px solid rgba(255,255,255,.55);border-radius:5px;padding:1px 6px;letter-spacing:.04em}
.rt{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-variant-numeric:tabular-nums}
.rt b{font-size:12px;font-weight:800;padding:2px 6px;border-radius:4px;color:#000}
.rt .r-imdb{background:#f5c518}.rt .r-tmdb{background:linear-gradient(90deg,#90cea1,#01b4e4)}.rt .r-rt{background:#fa320a;color:#fff}.rt .r-mc{background:#66cc33}.rt .r-lb{background:#2c3440;color:#fff;box-shadow:inset 4px 0 #ff8000,inset 8px 0 #00e054,inset 12px 0 #40bcf4;padding-left:16px}.rt .r-ac{background:#fecc00}.rt .r-sc{background:#1fd086}
.notes{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:17px}
.newb{align-self:stretch;margin:-12px -12px 0;padding:5px 4px;text-align:center;white-space:nowrap;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#0a84ff;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.crew .newb{margin:0;padding:2px 7px;border-radius:5px;font-size:10px}
.rows .row{padding-top:22px}
.card.rk{width:206px;padding-left:68px;box-sizing:border-box}
.card.rk .pst{z-index:1}
.rkn{position:absolute;left:-4px;bottom:26px;font:400 150px/.78 "Archivo Black",var(--ui);color:rgba(255,255,255,.06);-webkit-text-stroke:2px rgba(255,255,255,.55);letter-spacing:-.08em;transition:all .2s}
.rkn.two{font-size:120px;letter-spacing:-.12em;left:-10px}
.card.rk.foc .rkn{-webkit-text-stroke-color:#fff;color:rgba(255,255,255,.15)}
.card .reco{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px;white-space:nowrap;transition:transform .2s}
.card.foc .reco{color:#fff;transform:translateY(10px)}
.rt .imdb{background:#f5c518}.rt .tmdb{background:linear-gradient(90deg,#90cea1,#01b4e4);}
.syn{font-size:18px;line-height:1.45;color:rgba(255,255,255,.85);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:640px}

/* Rangées */
.rows{position:absolute;left:0;right:0;top:384px;bottom:0;-webkit-mask-image:linear-gradient(transparent 0,#000 22px);mask-image:linear-gradient(transparent 0,#000 22px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.sx{position:relative}.sx,.sy{scrollbar-width:none}
.sx::-webkit-scrollbar,.sy::-webkit-scrollbar,.rows::-webkit-scrollbar{display:none}
.row{position:relative;padding-top:4px}
.row h3{margin:0 0 0 64px;font-size:20px;font-weight:600;color:rgba(255,255,255,.78)}
.row h3 small{font-size:14px;color:rgba(255,255,255,.45);font-weight:500;margin-left:10px}
.sx{display:flex;gap:26px;overflow-x:auto;overflow-y:hidden;padding:16px 64px 14px}
.card{flex:0 0 auto;width:138px;cursor:pointer;position:relative}
.pst{width:138px;height:207px;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 6px 18px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.pst::before{content:"";position:absolute}
.pst::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.22),transparent 38%);opacity:.4;transition:opacity .2s}
.sh0::before{width:150%;height:90%;right:-60%;top:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%)}
.sh1::before{left:0;right:0;top:34%;height:22%;background:linear-gradient(90deg,transparent,rgba(0,0,0,.35),transparent);box-shadow:0 -40px 60px rgba(255,255,255,.12)}
.sh2::before{width:110px;height:110px;left:14px;top:20px;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 40px rgba(255,255,255,.15)}
.sh3::before{width:40%;height:180%;left:30%;top:-40%;transform:rotate(28deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
.pst-in{position:absolute;inset:0;padding:12px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 55%)}
.pst-k{font-size:10px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.8)}
.pst-t{display:block;color:#fff;text-wrap:balance;word-break:normal;overflow-wrap:normal;max-height:130px}
.f-bebas .pst-t{font:400 34px/.9 "Bebas Neue",var(--ui)}
.f-serif .pst-t{font:italic 700 22px/1.05 "Playfair Display",Georgia,serif}
.f-black .pst-t{font:400 17px/1.05 "Archivo Black",var(--ui);text-transform:uppercase}
.f-thin .pst-t{font:300 19px/1.1 "Outfit",var(--ui);text-transform:uppercase;letter-spacing:.12em}
.cap{font-size:14px;color:rgba(255,255,255,.6);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .2s}
.card.foc .pst{transform:scale(1.12) translateY(-4px);box-shadow:0 24px 40px rgba(0,0,0,.65)}
.card.foc .pst::after{opacity:1}
.card.foc .cap,.card.foc .role{color:#fff;transform:translateY(10px)}
.role{transition:transform .2s}
.card.hp .pst-in{padding-bottom:24px}
.prog{position:absolute;left:12px;right:12px;top:192px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;z-index:2;transition:transform .2s}
.prog i{display:block;height:100%;background:#fff}
.card.foc .prog{transform:translateY(8px) scale(1.08)}
.favdot{position:absolute;right:8px;top:8px;z-index:2;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:12px}

/* Boutons */
.btns{display:flex;gap:16px;flex-wrap:nowrap}
.btn{height:58px;padding:0 30px;border-radius:14px;background:rgba(255,255,255,.17);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;gap:10px;font-size:21px;font-weight:600;color:#fff;cursor:pointer;transition:all .18s cubic-bezier(.2,.8,.2,1)}
.btn svg{width:20px;height:20px;fill:currentColor}
.btn.round{width:58px;padding:0;justify-content:center;border-radius:50%}
.btn.foc{background:#fff;color:#000;transform:scale(1.07);box-shadow:0 14px 30px rgba(0,0,0,.45)}

/* Fiche détail */
.det{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.det-top{position:relative;padding:150px 64px 30px;min-height:560px;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;width:1100px;box-sizing:border-box}
.det-top .ttl{max-width:900px}
.det-top .syn{-webkit-line-clamp:5}
.crew{font-size:16px;color:rgba(255,255,255,.6);line-height:1.5}
.crew b{color:rgba(255,255,255,.9);font-weight:600}
.cast{flex:0 0 auto;width:132px;text-align:center;cursor:pointer}
.av{width:118px;height:118px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.92);background:radial-gradient(circle at 30% 25%,hsl(var(--h) 55% 58%),hsl(var(--h) 45% 22%));box-shadow:0 8px 20px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.cast .n{font-size:15px;font-weight:600;margin-top:12px;line-height:1.2}
.cast .r{font-size:13px;color:rgba(255,255,255,.55);margin-top:3px;line-height:1.2}
.cast.foc .av{transform:scale(1.12);box-shadow:0 20px 36px rgba(0,0,0,.6),0 0 0 3px #fff}
.seasons{display:flex;gap:10px;padding:14px 64px 4px;overflow-x:auto}
.chip{height:42px;padding:0 20px;border-radius:21px;display:flex;align-items:center;font-size:17px;font-weight:600;color:rgba(255,255,255,.7);background:rgba(255,255,255,.08);cursor:pointer;white-space:nowrap;transition:all .18s}
.chip.sel{background:rgba(255,255,255,.22);color:#fff}
.chip.foc{background:#fff;color:#000;transform:scale(1.07)}
.ep{flex:0 0 auto;width:260px;cursor:pointer}
.eth{width:260px;height:146px;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 16px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.eth::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at var(--x) 30%,rgba(255,255,255,.28),transparent 60%),linear-gradient(0deg,rgba(0,0,0,.5),transparent 60%)}
.eth span{position:absolute;left:12px;bottom:10px;z-index:1;font-size:13px;font-weight:700;letter-spacing:.1em}
.ep .et{font-size:16px;font-weight:600;margin-top:12px}
.ep .ed{font-size:13px;color:rgba(255,255,255,.55);margin-top:3px}
.ep.foc .eth{transform:scale(1.08);box-shadow:0 20px 36px rgba(0,0,0,.6)}

/* Acteur */
.act-top{display:flex;gap:40px;align-items:center;padding:120px 64px 20px}
.act-top .av{width:200px;height:200px;font-size:64px;margin:0}
.act-top h1{margin:0;font-size:56px;font-weight:700;letter-spacing:-.02em}
.act-top p{margin:8px 0 0;font-size:19px;color:rgba(255,255,255,.65)}
.card .role{font-size:12px;color:rgba(255,255,255,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* TV en direct */
.live{position:absolute;inset:110px 0 0 0;display:grid;grid-template-columns:220px 390px 1fr;grid-template-rows:minmax(0,1fr);gap:20px;padding:0 48px 30px}
.lcats{position:relative;display:flex;flex-direction:column;gap:4px;overflow-y:auto;scrollbar-width:none}
.lcat{height:46px;padding:0 16px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:500;color:rgba(255,255,255,.7);cursor:pointer;transition:all .16s}
.lcat small{font-size:14px;opacity:.6;font-variant-numeric:tabular-nums}
.lcat.sel{background:rgba(255,255,255,.12);color:#fff}
.lcat.foc{background:#fff;color:#000;transform:scale(1.04)}
.lchs{position:relative;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 10px 20px 4px}
.lch{display:grid;grid-template-columns:34px 76px 1fr;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;cursor:pointer;background:rgba(255,255,255,.05);transition:all .16s}
.lch .num{font-size:15px;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums;text-align:right}
.logo{height:44px;border-radius:9px;display:grid;place-items:center;background:var(--c);font-size:13px;font-weight:800;letter-spacing:-.01em;text-align:center;line-height:1.05;padding:0 4px;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.lch .nm{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lch .pg{font-size:13px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;opacity:.9}
.lch.foc{background:#fff;color:#000;transform:scale(1.035);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.lch.foc .num,.lch.foc .pg{color:rgba(0,0,0,.6)}
.lch.foc .bar{background:rgba(0,0,0,.15)}
.lpanel{min-width:0;display:flex;flex-direction:column;gap:16px}
.prev{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#111;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.vid{position:absolute;inset:-20%;background:radial-gradient(40% 50% at 30% 40%,var(--c),transparent 70%),radial-gradient(35% 45% at 70% 60%,#ffffff22,transparent 70%),linear-gradient(135deg,#0b0b12,#1a1a24);animation:drift 9s ease-in-out infinite alternate;filter:saturate(1.2)}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(6%,-4%) scale(1.15)}}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px)}
.livebadge{position:absolute;left:14px;top:14px;background:var(--live);color:#fff;font-size:12px;font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:6px;display:flex;align-items:center;gap:6px}
.livebadge::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.prev .logo{position:absolute;right:14px;top:14px;height:36px;min-width:70px}
.prev .wm{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:13px;color:rgba(255,255,255,.45)}
.now h4{margin:0;font-size:24px;font-weight:700}
.now .tm{font-size:15px;color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.now .bar{height:5px;color:#fff}
.next{display:flex;flex-direction:column;gap:2px;font-size:15px}
.next div{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.05)}
.next b{font-weight:600;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.7)}
.next em{font-style:normal;color:rgba(255,255,255,.45);font-size:13px}

/* Recherche */
.srch{position:absolute;inset:110px 0 0 0;display:grid;grid-template-columns:400px 1fr;grid-template-rows:minmax(0,1fr);gap:30px;padding:0 0 0 64px}
.qbox{height:58px;border-radius:14px;background:rgba(255,255,255,.1);display:flex;align-items:center;padding:0 18px;font-size:24px;font-weight:500;margin-bottom:18px}
.qbox .ph{color:rgba(255,255,255,.4)}
.qbox .caret{width:2px;height:28px;background:#fff;margin-left:2px;animation:blink 1s infinite}
.kb{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.key{height:52px;border-radius:12px;display:grid;place-items:center;font-size:21px;font-weight:500;background:rgba(255,255,255,.07);cursor:pointer;transition:all .15s;text-transform:uppercase}
.key.w2{grid-column:span 2;font-size:16px;text-transform:none}
.key.foc{background:#fff;color:#000;transform:scale(1.1)}
.res{overflow-y:auto;padding:0 40px 30px 0;position:relative}
.res h3{margin:6px 0 0;font-size:20px;font-weight:600;color:rgba(255,255,255,.78)}
.res .sx{padding-left:6px;flex-wrap:wrap;overflow:visible;row-gap:30px}

 raw=String(raw||"").replace(/[ᴬᴮᴰᴱᴳᴴᴵᴶᴷᴸᴹᴺᴼᴾᴿᵀᵁⱽᵂᶠˢʰᵈᵏ⁰¹²³⁴⁵⁶⁷⁸⁹⁺]+/g,m=>" "+[...m].map(c=>SUP[c]||"").join("")+" ");

/* Cache du catalogue sur l'appareil (IndexedDB) : démarrage instantané */

/* Certains serveurs ne renvoient pas tout d'un coup : les catégories restées vides sont demandées une par une */
async function fillCats(pl,action,cats,list,map,D){

  const arr=Array.isArray(r)?r:Object.values(r||{}).filter(x=>x&&typeof x==="object");if(arr.length)D.fill++;

 await worker();
 if(added)LOG(`${pl.name} · ${action} : +${added} éléments récupérés dans ${miss.length} catégories`);

const ADULT=/(^|[^a-z0-9])(adult|adulte|adultes|adults|xxx|porn|porno|sexe|sex|erotic|erotique|erotica|charme|hentai|for adults)([^a-z0-9]|$)|18 ?\+|\+ ?18/;

function dropAdult(D){if(S.set.adult)return 0;let n=0;
 for(const [lk,lst] of [["lc","live"],["vc","vod"],["sc","ser"]]){const m=D[lk]||{},bad=new Set();
  for(const k of Object.keys(m))if(isAdultCat(m[k])){bad.add(String(k));delete m[k];n++}
  if(bad.size)D[lst]=(D[lst]||[]).filter(x=>{if(!bad.has(String(x.cat)))return true;const alt=(x.cs||[]).map(String).find(c=>m[c]!=null&&!bad.has(c));if(alt){x.cat=alt;return true}return false})}

 if(/[\u0600-\u06FF\u0400-\u04FF\u0590-\u05FF\u0E00-\u0E7F\u3040-\u30FF\u4E00-\u9FFF\uAC00-\uD7AF]/.test(t))return false;

function key(k){
 LASTKEY=Date.now();
 if(S.loading)return;
 if(S.modal){if(k==="back"){const r=S.modal.ret;S.modal=null;render(r);return}
  if(k==="up"||k==="down"||k==="left"||k==="right"){move(k);return}
  if(k==="ok"&&F){act(F.dataset.act);return}return}
 const t=topS();
 if(t.t==="player"&&P){
  if(P.kind==="vod"){
   if(SC.on&&k==="ok"){commitScrub();return}
   if(SC.on&&k==="back"){endScrub();toast("Défilement annulé");return}
   if(k==="rw"||k==="ff"){uiPing();scrubStep(k==="ff"?1:-1);return}
   if(F&&F.dataset.fid==="p-seek"&&(k==="left"||k==="right")&&$("#pov")&&!$("#pov").classList.contains("hid")){uiPing();scrubStep(k==="right"?1:-1);return}
   if(SC.on&&(k==="up"||k==="down"))commitScrub();
  }
  if(k!=="back"&&uiPing()&&k!=="play"&&k!=="menu")return;
  if(k==="menu"){act(P.kind==="vod"?"p:audio":"p:info");return}
  if(P.kind==="live"&&(k==="up"||k==="down")){zap(k==="up"?-1:1);return}
  if(k==="play"){act("p:pp");return}
  if(k==="rw"||k==="ff"){if(P.kind==="vod")act("p:"+k);else zap(k==="ff"?1:-1);return}
 }
 switch(k){
  case "up":case "down":case "left":case "right":move(k);break;
  case "ok":if(F){if(F.tagName==="INPUT"){move("down");break}act(F.dataset.act)}break;
  case "back":back();break;
  case "home":if(!inApp())break;if(P)stopPlayer();S.stack=[{t:"home"}];S.tab="films";render("tab-films");break;
  case "mic":if(!inApp())break;if(P)stopPlayer();S.stack=[{t:"home"}];S.tab="search";render("k-a");break;

  case "play":if(F){const h=F.dataset.hov||"";if(ALL[h])act("play:"+h);else if(h.startsWith("ch:"))act("live:"+h.slice(3))}break;
 }
}

  const it=ALL[id];if(!it)return "";const v=pickSrc(id);if(!v||!compat(v))return "";
  let url="",pos=0;
  const mk=s=>[clean(s.url),encodeURIComponent(s.user),encodeURIComponent(s.pass)];
  if(it.type==="f"){const [u,us,pw]=mk(v.p);url=`${u}/movie/${us}/${pw}/${v.sid}.${v.ext}`;pos=(S.prog[id]||0)*(it.d||0)*60}
  else{if(!it.info)return "";const sn=(it.seasons||[])[ss-1];const e=((it.eps||{})[sn]||[]).find(x=>x.num===ep);if(!e)return "";
   const vv=srcs(id).find(z=>z.p.id===it.srcPl)||v;const [u,us,pw]=mk(vv.p);url=`${u}/series/${us}/${pw}/${e.id}.${e.ext}`}
  NAT.pre=url;Prisme.preload(url,Math.round(pos*1000));return "";
 },
 unpreload(){if(NAT.pre&&!P)Prisme.unpreload();NAT.pre=null;setTimeout(pumpProbe,1500);return ""},
 tab(v){NAT.vis=false;S.tab=v;S.modal=null;S.stack=[{t:"home"}];save();render("tab-"+v);return ""},
 web(kind,id){NAT.vis=false;S.retNat=true;S.modal=null;S.stack=[{t:"home"},{t:kind,id}];render(null);return ""},
 resume(){NAT.vis=false;S.stack=S.stack.filter(x=>x.t!=="player");S.modal=null;render(topS().last);return ""}
};

/* Fiche native : mise à jour quand les infos, la qualité ou les photos arrivent */
/* Contenu d'une fiche pour l'interface native (sans effet de bord : appelé à chaque mise à jour) */
function natData(id){
  const it=ALL[id];if(!it)return {error:"introuvable",cast:[]};
  const L=srcs(id),cur=pickSrc(id),isS=it.type==="s";
  const o={id,ty:it.type,t:it.t,f:it.f,c1:it.c[0],c2:it.c[1],img:tmS(it.img,"w342"),bd:tmS(it.bd,"w1280"),
   kick:(isS?"Série":"Film")+((it.g||[])[0]?" · "+it.g[0]:""),meta:metaArr(it),age:it.age||"",tmdb:tmdbTxt(it),imdb:it.imdb?it.imdb.toFixed(1):"",
   s:it.s||(!it.info&&!it.loading&&it.infoErr?`Résumé indisponible : le serveur n'a pas répondu (${it.infoErr})`:""),dir:it.dir||"",loading:!it.info&&!!it.loading,fav:isFav(id)};
  const nm=c=>A[c[0]]||c[2]||"";
  o.castLine=it.cast.slice(0,3).map(nm).filter(Boolean).join(", ");
  o.cast=it.cast.slice(0,14).map(c=>({id:c[0],n:nm(c),r:c[1]||"",ph:photoOf(nm(c))}));
  wantPhotos(o.cast.map(c=>c.n).filter(Boolean));
  const ad=added(id);o.added=ad?(ad.d===0?"aujourd'hui":ad.d===1?"hier":`il y a ${ad.d} jours`)+" sur "+ad.p.name:"";
  o.sources=L.map(v=>({id:v.id,q:v.q,pl:v.p.name,name:v.name||"",codec:v.codec||"",audio:(v.audio||[]).join(" | "),subs:(v.subs||[]).join(", "),fmt:"."+(v.ext||""),ok:compat(v),def:!!cur&&cur.id===v.id}));
  if(cur){o.srcLine=[cur.p.name,cur.q,cur.tag].filter(Boolean).join(" · ");o.srcQ=qr(cur.q)>0&&cur.q!=="Auto"?cur.q:""}
  if(!isS){const pr=S.prog[id]||0;o.playLabel=pr>0.02&&it.d?`Reprendre à ${dur(Math.round(pr*it.d))}`:"Lecture"}
  else{
   const le=(S.lastEp||{})[id],sn=it.seasons||[];
   o.seasons=sn.map((n,i)=>({n:String(n),label:"Saison "+n,eps:((it.eps||{})[n]||[]).map(e=>({num:e.num,t:e.t,d:e.dur?e.dur+" min":"",img:tmS(e.img,"w300"),q:e.q||"",pr:le&&le.ss===i+1&&le.ep===e.num?(le.pct||0):0}))}));
   if(le&&sn[le.ss-1]!=null){o.resume={ss:le.ss,ep:le.ep};o.ssel=le.ss-1;o.playLabel=`Reprendre S${sn[le.ss-1]} E${le.ep}`}
   else{o.ssel=0;const e0=((it.eps||{})[sn[0]]||[])[0];o.playLabel=it.info&&e0?`Lecture S${sn[0]} E${e0.num}`:"Lecture"}
  }
  o.similar=memo("nsim"+id,()=>[...films(),...series()].filter(x=>x.id!==id&&x.type===it.type&&((it.g||[]).length?(x.g||[]).some(g=>it.g.includes(g)):x.cat[0]===it.cat[0])).slice(0,12)).map(i=>nI(i,false));
  return o;
}
function natPush(id){if(!NAT.vis||!id||NAT.detail!==id)return;clearTimeout(NAT.pt);NAT.pt=setTimeout(()=>{try{const s=JSON.stringify(natData(id));if(s!==NAT.last){NAT.last=s;Prisme.nativeEvent("detail",s)}}catch(e){}},350)}

/* Lecture lancée depuis le natif : changement de source automatique et nouvel essai si la connexion est encore occupée */
function natSwitch(reason){
 const it=ALL[P.id];if(!it||it.type!=="f"||P.kind!=="vod")return false;
 const L=srcs(P.id).filter(compat),i=L.findIndex(v=>v.id===P.src),nx=L[i+1];if(!nx)return false;
 const old=curVar();P.src=nx.id;P.t0=Date.now();P.err=0;P.retry=0;P.aSync=null;P.audio=null;P.sub=null;P.started=false;
 Prisme.play(streamUrl(),Math.round((P.pos||0)*1000),false);LOG(`Source changée (${reason}) : ${old?old.p.name+" "+old.q:""} → ${nx.p.name} ${nx.q}`);
 if(P.nat)Prisme.nativeEvent("loading",JSON.stringify({banner:`${old?old.p.name+" "+old.q:"La source"} ne répond pas · passage à ${nx.p.name} ${nx.q}`,q:qr(nx.q)>0&&nx.q!=="Auto"?nx.q:"",src:nx.p.name+(nx.tag?" · "+nx.tag:""),msg:"Démarrage de la vidéo…",warn:false}));
 else toast(`Source suivante : ${nx.p.name} ${nx.q}`);
 return true}
function natFail(msg){LOG("Lecture impossible · "+msg);if(P&&P.nat){Prisme.nativeEvent("playfail",JSON.stringify({msg:"Lecture impossible : "+msg}));stopPlayer();if(topS().t==="player")S.stack.pop();NAT.vis=true;return true}return false}
/* Appelé à chaque tour du lecteur : true = la suite de tick() est ignorée */
function natTick(st){
 if(!P)return true;
 if(!P.started&&(st.playing||(st.pos>0&&!st.buffering))){P.started=true;P.retry=0;if(P.nat)Prisme.nativeEvent("started","")}
 if(P.retryAt){if(Date.now()<P.retryAt)return true;P.retryAt=0;P.err=0;Prisme.play(streamUrl(),Math.round((P.pos||0)*1000),P.kind==="live");return true}
 if(st.error&&!P.err){
  const code=+((String(st.error).match(/(?:Response code|code)[: ]+(\d{3})/i)||[])[1]||0);
  if([401,403,429,456,458,503,509,551].includes(code)&&(P.retry||0)<5){
   P.retry=(P.retry||0)+1;P.retryAt=Date.now()+4000;P.err=1;LOG(`Serveur occupé (code ${code}) · nouvel essai ${P.retry} sur 5`);
   const m=`Connexion précédente en cours de fermeture… nouvel essai ${P.retry} sur 5`;
   if(P.nat)Prisme.nativeEvent("loading",JSON.stringify({msg:m,warn:true}));else toast(m);
   return true}
  if(!P.started){P.err=1;LOG("Erreur de lecture · "+String(st.error).slice(0,160));if(natSwitch("erreur"))return true;if(natFail(String(st.error).slice(0,120)))return true;P.err=0}
 }
 if(P&&!P.started&&!st.error&&P.nat&&!P.slowMsg&&Date.now()-(P.t0||0)>10000){P.slowMsg=1;Prisme.nativeEvent("loading",JSON.stringify({msg:"Le serveur met du temps à répondre…"}))}
 if(P&&!P.started&&!st.error&&P.nat&&Date.now()-(P.t0||0)>25000){P.t0=Date.now();P.slowMsg=0;if(natSwitch("délai dépassé"))return true;if(!P.slowFail){P.slowFail=1;return false}if(natFail("la vidéo ne démarre pas (pas de réponse du serveur)"))return true}
 return false}

/* ========================= ÉTAPE 2 : TMDB, genres réels, recherche et acteurs natifs ========================= */
/* Clé TMDB intégrée à l'appli à la compilation (secret GitHub) : utilisée si aucune clé n'est saisie */
if(NATIVE&&typeof Prisme.tmdbKey==="function"&&!S.set.tmdbKey){try{const k=Prisme.tmdbKey();if(k){S.set.tmdbKey=k;S.set.tmdbBuiltin=true;save()}}catch(e){}}

/* Genres TMDB rangés en arrière-plan, sans aucune demande au fournisseur IPTV, gardés sur l'appareil */
const TGM={f:{28:"action",12:"aventure",16:"animation",35:"comedie",80:"policier",99:"documentaire",18:"drame",10751:"familial",14:"fantastique",36:"histoire",27:"horreur",10402:"musique",9648:"mystere",10749:"romance",878:"sf",10770:"telefilm",53:"thriller",10752:"guerre",37:"western"},
 s:{10759:"action",16:"animation",35:"comedie",80:"policier",99:"documentaire",18:"drame",10751:"familial",10762:"jeunesse",9648:"mystere",10763:"actu",10764:"realite",10765:"sf",10766:"feuilleton",10767:"talk",10768:"guerre",37:"western"}};
let TG={};const TGS={run:false,done:0,found:0,todo:0,loaded:false,lastBump:0,dirty:0};
const nap=ms=>new Promise(r=>setTimeout(r,ms));
let TGSAVE=null;function tgSave(){clearTimeout(TGSAVE);TGSAVE=setTimeout(()=>{IDB.put("tg",TG).catch(()=>{})},8000)}
function tgKeys(it){const v=TG[it.id];if(!v||v[0]==="-")return null;const g=v.split(":")[1]||"";if(!g)return null;
 const M=TGM[it.type],out=[];g.split(",").forEach(x=>{const k=M[x];if(k&&!out.includes(k))out.push(k)});return out.length?out:null}
function tgBump(force){if(!TGS.dirty)return;if(!force&&Date.now()-TGS.lastBump<180000)return;TGS.lastBump=Date.now();TGS.dirty=0;NAT.gv++;if(NAT.vis)Prisme.nativeEvent("home","")}
async function tgRun(){
 if(TGS.run||!S.set.tmdbKey)return;TGS.run=true;
 try{
  if(!TGS.loaded){try{TG=(await IDB.get("tg"))||{}}catch(e){TG={}}TGS.loaded=true;NAT.gv++;if(NAT.vis)Prisme.nativeEvent("home","")}
  const d=i=>{const a=added(i.id);return a?a.d:1e9};
  const todo=[...films(),...series()].filter(i=>!(i.id in TG)).sort((a,b)=>d(a)-d(b));
  TGS.todo=todo.length;let fails=0;
  for(const it of todo){
   if(!S.set.tmdbKey||!ALL[it.id])continue;
   while(P)await nap(5000);
   try{
    if(it.tmdbId&&it.tmdbId!=="0"){const r=await tmdb((it.type==="f"?"movie/":"tv/")+it.tmdbId);
     TG[it.id]=r&&r.genres?it.tmdbId+":"+r.genres.map(g=>g.id).join(","):"-";
     if(r){if(!it.s&&r.overview&&isFr(r.overview))it.s=r.overview;if(!it.bd&&r.backdrop_path)it.bd="https://image.tmdb.org/t/p/w1280"+r.backdrop_path;if(!it.tmdb&&r.vote_average)it.tmdb=Math.round(r.vote_average*10)}}
    else{const y=it.y?(it.type==="f"?"&year=":"&first_air_date_year=")+it.y:"";
     const r=await tmdb(`search/${it.type==="f"?"movie":"tv"}?query=${encodeURIComponent(String(it.t).slice(0,80))}${y}`);
     const m=r&&r.results&&r.results[0];TG[it.id]=m?m.id+":"+(m.genre_ids||[]).join(","):"-";
     if(m){it.tmdbId=String(m.id);if(!it.bd&&m.backdrop_path)it.bd="https://image.tmdb.org/t/p/w1280"+m.backdrop_path;if(!it.tmdb&&m.vote_average)it.tmdb=Math.round(m.vote_average*10)}}
    if(TG[it.id][0]!=="-")TGS.found++;fails=0;
   }catch(e){fails++;if(/401/.test(e.message)){LOG("TMDB refuse la clé API : rangement des genres arrêté");break}
    if(/429/.test(e.message)||fails>5){await nap(30000);fails=0}}
   TGS.done++;TGS.dirty++;tgSave();tgBump(false);
   await nap(230);
  }
  tgBump(true);if(TGS.done)LOG(`Genres TMDB : ${TGS.found} titres classés sur ${TGS.done} vérifiés`);
 }finally{TGS.run=false}}
setTimeout(()=>tgRun(),20000);

/* Résumé et fond depuis TMDB quand le fournisseur ne les donne pas */
async function tmdbFill(it){
 if(!S.set.tmdbKey||it._tf||(it.s&&it.bd))return;it._tf=1;
 try{let id=it.tmdbId;
  if(!id||id==="0"){const y=it.y?(it.type==="f"?"&year=":"&first_air_date_year=")+it.y:"";const r=await tmdb(`search/${it.type==="f"?"movie":"tv"}?query=${encodeURIComponent(String(it.t).slice(0,80))}${y}`);const m=r&&r.results&&r.results[0];if(!m)return;id=it.tmdbId=String(m.id)}
  const r=await tmdb((it.type==="f"?"movie/":"tv/")+id);if(!r)return;
  if(!it.s&&r.overview&&isFr(r.overview))it.s=r.overview;if(!it.bd&&r.backdrop_path)it.bd="https://image.tmdb.org/t/p/w1280"+r.backdrop_path;
  if(!it.tmdb&&r.vote_average)it.tmdb=Math.round(r.vote_average*10);if(!(it.g||[]).length&&r.genres)it.g=r.genres.map(g=>g.name).slice(0,3);
  if(!it.d&&r.runtime)it.d=r.runtime;
  natPush(it.id)}catch(e){}}

/* Recherche native */
nativeApi.search=function(q){const old=S.q;S.q=String(q||"");let r;try{r=searchResults()}finally{S.q=old}wantPhotos(r.a.slice(0,20).map(a=>A[a]).filter(Boolean));
 return JSON.stringify({films:r.f.slice(0,60).map(i=>nI(i)),series:r.s.slice(0,60).map(i=>nI(i)),actors:r.a.slice(0,20).map(a=>({id:a,n:A[a],r:`${acred(a).length} titre${acred(a).length>1?"s":""}`,ph:photoOf(A[a])})),nf:r.f.length,ns:r.s.length})};
/* Page acteur native */
function natActor(aid){const n=A[aid]||"",cr=acred(aid);return {id:aid,n,ph:photoOf(n),count:cr.length,items:cr.map(([id,r])=>Object.assign(nI(ALL[id]),{role:r||""}))}}
nativeApi.actor=function(aid){const n=A[aid]||"";if(n)wantPhotos([n]);
 if(S.set.tmdbKey&&!ACTD[aid])loadActor(aid).then(()=>{if(NAT.vis)Prisme.nativeEvent("actor",JSON.stringify(natActor(aid)))});
 return JSON.stringify(natActor(aid))};
/* Après un arrêt de l'interface par manque de mémoire, on l'explique */
try{if(NATIVE&&typeof Prisme.lastCrash==="function"&&Date.now()-Prisme.lastCrash()<120000){LOG("L'interface a été relancée après un manque de mémoire");setTimeout(()=>toast("L'appli a manqué de mémoire et a été relancée"),4000)}}catch(e){}

boot();
