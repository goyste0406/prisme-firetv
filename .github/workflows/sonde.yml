name: Sonde réseau (bandes-annonces, police)
on:
  push:
    branches: [appletv]
    paths: [".github/workflows/sonde.yml"]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: iTunes Search API (bandes-annonces Apple)
        continue-on-error: true
        run: |
          for q in "term=interstellar&country=fr" "term=interstellar&country=us&media=all" "term=dune&entity=movie&country=fr&attribute=movieTerm" "term=nolan&entity=movieArtist&country=us"; do
            echo "== $q"; curl -s -m 20 "https://itunes.apple.com/search?$q&limit=8" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['resultCount']);[print(r.get('wrapperType'),r.get('kind'),'|',r.get('trackName') or r.get('collectionName') or r.get('artistName'),'|',r.get('previewUrl')) for r in d['results']]"
          done
          echo "== rss top films"; curl -s -m 20 "https://itunes.apple.com/fr/rss/topmovies/limit=3/json" | head -c 1500; echo
      - name: Polices du simulateur (OFL)
        run: |
          mkdir out
          G=https://github.com/google/fonts/raw/main/ofl
          curl -sL -o out/PlayfairDisplay-Italic.ttf "$G/playfairdisplay/PlayfairDisplay-Italic%5Bwght%5D.ttf"
          curl -sL -o out/PlayfairDisplay.ttf "$G/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"
          curl -sL -o out/BebasNeue-Regular.ttf "$G/bebasneue/BebasNeue-Regular.ttf"
          curl -sL -o out/ArchivoBlack-Regular.ttf "$G/archivoblack/ArchivoBlack-Regular.ttf"
          curl -sL -o out/Outfit.ttf "$G/outfit/Outfit%5Bwght%5D.ttf"
          curl -sL -o out/OFL-Playfair.txt "$G/playfairdisplay/OFL.txt"
          curl -sL -o out/OFL-Bebas.txt "$G/bebasneue/OFL.txt"
          curl -sL -o out/OFL-Archivo.txt "$G/archivoblack/OFL.txt"
          curl -sL -o out/OFL-Outfit.txt "$G/outfit/OFL.txt"
          ls -la out; file out/*
          cd out && zip -q ../police.zip *
      - name: Publier
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view sonde-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create sonde-latest -R "$GITHUB_REPOSITORY" --prerelease -t "sonde" -n "sonde" --target appletv
          gh release upload sonde-latest police.zip --clobber -R "$GITHUB_REPOSITORY"
