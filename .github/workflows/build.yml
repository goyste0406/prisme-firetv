name: Compiler et publier l'APK

on:
  push:
    branches: [main, native]
    paths-ignore: ["README.md", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Polices de l'interface native (Google Fonts, licence OFL)
        run: |
          mkdir -p app/src/main/assets/fonts
          base=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL -o app/src/main/assets/fonts/Outfit.ttf "$base/outfit/Outfit%5Bwght%5D.ttf" || echo "Outfit absente"
          curl -fsSL -o app/src/main/assets/fonts/BebasNeue.ttf "$base/bebasneue/BebasNeue-Regular.ttf" || echo "Bebas absente"
          curl -fsSL -o app/src/main/assets/fonts/PlayfairItalic.ttf "$base/playfairdisplay/PlayfairDisplay-Italic%5Bwght%5D.ttf" || echo "Playfair absente"
          curl -fsSL -o app/src/main/assets/fonts/ArchivoBlack.ttf "$base/archivoblack/ArchivoBlack-Regular.ttf" || echo "Archivo absente"
          find app/src/main/assets/fonts -size -1k -delete
          ls -la app/src/main/assets/fonts

      - name: Clé TMDB (secret facultatif, jamais affichée)
        env:
          TMDB: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB" ]; then printf '%s' "$TMDB" > app/src/main/assets/tmdb.txt; echo "Clé TMDB intégrée"; else echo "Pas de clé TMDB"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilation (signée avec keystore/prisme-release.jks)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/prisme-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: prisme
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Le secret KEYSTORE_PASSWORD est absent : ajoute-le dans Settings > Secrets and variables > Actions" | tee build.log
            exit 1
          fi
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Préparer la version
        id: v
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/prisme.apk
          SIZE=$(stat -c%s out/prisme.apk)
          DATE=$(LC_ALL=fr_FR.UTF-8 date -u '+%-d %B %Y' 2>/dev/null || date -u '+%Y-%m-%d')
          NOTES=$(git log -1 --pretty=%B | sed '/^$/d' | sed '/^Co-Authored-By/d;/^Claude-Session/d' | jq -R . | jq -s .)
          jq -n --arg n "$NAME" --argjson c "$CODE" --argjson s "$SIZE" --arg d "$DATE" --argjson notes "$NOTES" \
            --arg apk "https://github.com/${{ github.repository }}/releases/download/v$NAME/prisme.apk" \
            '{versionName:$n, versionCode:$c, size:$s, date:$d, notes:$notes, apk:$apk}' > out/version.json
          cat out/version.json
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Version de test (branche native, jamais proposée en mise à jour)
        if: github.ref == 'refs/heads/native'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${GITHUB_SHA::7}"
          gh release create "$TAG" out/prisme.apk --title "Test $TAG" --notes "Version de test de l'interface native" --prerelease --target "$GITHUB_SHA"

      - name: Publier la release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/prisme.apk out/version.json --clobber
          else
            gh release create "$TAG" out/prisme.apk out/version.json --title "prisme ${{ steps.v.outputs.name }}" --notes-file <(jq -r '.notes[]' out/version.json) --latest
          fi

      - name: Signaler l'échec dans une issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          { echo "Commit : ${{ github.sha }}"; echo; echo '```'; grep -E "e: |error:|FAILURE|What went wrong|Exception|BUILD" build.log | head -80; echo; tail -c 30000 build.log; echo '```'; } > issue.md
          gh issue create --title "Échec de compilation (${GITHUB_SHA::7})" --body-file issue.md

      - uses: actions/upload-artifact@v4
        with:
          name: prisme-apk
          path: out/
