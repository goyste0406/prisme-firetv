name: Visite de l'appli dans le simulateur Apple TV

# Lance la vraie app dans le simulateur tvOS avec un faux fournisseur local, la pilote à la télécommande virtuelle
# et garde une capture d'écran de chaque étape (artefact « visite »). Ne touche pas à l'IPA.
on:
  push:
    branches: [appletv]
    paths: ["IPTVPerso/**", "TopShelf/**", "Shared/**", "IPTVPersoUITests/**", "ci/**", "project.yml", "Podfile", ".github/workflows/visite-tvos.yml"]
  workflow_dispatch:
    inputs:
      machine:
        description: "Type de Mac GitHub (macos-15-intel par défaut ; essais : macos-15, macos-26)"
        required: false
        default: ""
      seulement:
        description: "Partie à visiter seule (lecteur, serie, tv, nav, multi, perf, fournisseurs, fiches, tvlecteur, tvcrash, tvidle, gouts, geant, langue, reglages, dit, sauvegarde, accueil, duo, sources, envoi, finserie, finfilm, lot1, lot2, lot3, lot3g, lot4, lot4n, lot5, lot5t, lot6), vide = visite complète"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  visite:
    runs-on: ${{ inputs.machine || 'macos-15-intel' }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages --quiet pillow || python3 -m pip install --user --quiet pillow || true

      - name: Projet Xcode et lecteur VLC
        run: |
          xcodegen generate
          pod install --repo-update

      - name: Simulateur Apple TV
        run: |
          xcrun simctl list runtimes | grep -i tvos || true
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys;r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='tvOS' and x['isAvailable']];print(r[-1]['identifier'])")
          DT=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys;d=[x for x in json.load(sys.stdin)['devicetypes'] if 'Apple-TV-4K-3rd' in x['identifier'] or 'Apple TV 4K (3rd' in x['name']];print(d[0]['identifier'])")
          UDID=$(xcrun simctl create prisme-tv "$DT" "$RT")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          # interface en français, comme sur ton Apple TV
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array fr
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale fr_FR
          echo "Simulateur : $DT · $RT · $UDID"

      - name: Faux fournisseur local
        run: |
          nohup python3 ci/fake_server.py 8099 main > fake.log 2>&1 &
          nohup python3 ci/fake_server.py 8098 second > fake2.log 2>&1 &
          nohup python3 ci/fake_server.py 8097 big > fake3.log 2>&1 &
          nohup python3 ci/fake_server.py 8096 giant > fake4.log 2>&1 &
          nohup python3 ci/fake_server.py 8095 cut > fake5.log 2>&1 &
          sleep 3
          curl -s "http://127.0.0.1:8099/player_api.php?username=demo&password=demo" | head -c 200

      - name: Deuxième Apple TV (visite « envoi » seulement)
        if: ${{ inputs.seulement == 'envoi' }}
        run: |
          mkdir -p shots
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys;r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='tvOS' and x['isAvailable']];print(r[-1]['identifier'])")
          DT=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys;d=[x for x in json.load(sys.stdin)['devicetypes'] if 'Apple-TV-4K-3rd' in x['identifier'] or 'Apple TV 4K (3rd' in x['name']];print(d[0]['identifier'])")
          UDID2=$(xcrun simctl create prisme-tv-2 "$DT" "$RT")
          xcrun simctl boot "$UDID2"
          xcrun simctl spawn "$UDID2" defaults write -g AppleLanguages -array fr
          nohup bash ci/receiver.sh "$UDID2" "$PWD/shots" > receiver.log 2>&1 &
          echo "2e simulateur : $UDID2"

      - name: Visite (télécommande + captures)
        run: |
          mkdir -p shots
          set -o pipefail
          TEST_RUNNER_SHOTS="$PWD/shots" TEST_RUNNER_ONLY="${{ inputs.seulement }}" xcodebuild -workspace IPTVPerso.xcworkspace -scheme IPTVPerso -configuration ${{ (inputs.seulement == 'lot3g' || inputs.seulement == 'auditg') && 'Release' || 'Debug' }} \
            -destination "id=$UDID" -derivedDataPath build-sim -resultBundlePath visite.xcresult \
            CODE_SIGNING_ALLOWED=${{ inputs.seulement == 'lot6' && 'YES' || 'NO' }} CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            ENABLE_TESTABILITY=YES test 2>&1 | tee test.log | grep -E "error:|Test Case|passed|failed|TEST (SUCCEEDED|FAILED)" || true
          ls -la shots | head -80 || true

      - name: Captures (publiées dans la release « visite-latest »)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat shots/focus.txt || true
          # visite « envoi » : attendre la fin de la 2e Apple TV (captures et données)
          if [ -f receiver.log ]; then for i in $(seq 1 80); do grep -q -E "^fini|pas d'appli" receiver.log && break; sleep 10; done; cat receiver.log; fi
          mkdir -p jpg
          for f in shots/*.png; do n=$(basename "$f" .png); sips -s format jpeg -s formatOptions 72 -Z 1600 "$f" --out "jpg/$n.jpg" >/dev/null 2>&1 || true; done
          cp shots/focus.txt jpg/ 2>/dev/null || true
          cp shots/*.txt jpg/ 2>/dev/null || true
          cp receiver.log jpg/ 2>/dev/null || true
          # classement de la TV en direct écrit par l'appli (simulateur de test seulement)
          C=$(xcrun simctl get_app_container "$UDID" com.steven.iptvperso data 2>/dev/null || true)
          [ -n "$C" ] && cp "$C/Documents/classement-tv.txt" jpg/ 2>/dev/null || true
          [ -n "$C" ] && cp "$C/Documents/mesures.txt" jpg/ 2>/dev/null || true
          [ -n "$C" ] && cp "$C/Documents/donnees.txt" jpg/ 2>/dev/null || true
          # lot 6 : ce que l'appli a écrit pour le module Top Shelf (boîte partagée)
          G=$(xcrun simctl get_app_container "$UDID" com.steven.iptvperso group.com.steven.iptvperso 2>/dev/null || true)
          if [ -n "$G" ] && [ -d "$G/TopShelf" ]; then for f in "$G"/TopShelf/*; do cp "$f" "jpg/topshelf-$(basename "$f")"; done; fi
          grep -E "error:|Test Case|passed|failed" test.log > jpg/test-resume.txt 2>/dev/null || true
          # rapports de plantage de l'appli dans le simulateur (s'il y en a), pour trouver la ligne en cause
          for f in ~/Library/Logs/DiagnosticReports/IPTVPerso*.ips ~/Library/Logs/DiagnosticReports/prisme*.ips; do [ -f "$f" ] && head -c 3000000 "$f" > "jpg/plantage-$(basename "$f" .ips).txt"; done 2>/dev/null || true
          (cd jpg && zip -q ../visite.zip *)
          ls -lh visite.zip
          if gh release view visite-latest >/dev/null 2>&1; then gh release upload visite-latest visite.zip --clobber
          else gh release create visite-latest visite.zip --target appletv --prerelease --title "Visite automatique (captures)" --notes "Captures de la visite automatique dans le simulateur Apple TV"; fi
