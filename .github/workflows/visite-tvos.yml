name: Visite de l'appli dans le simulateur Apple TV

# Lance la vraie app dans le simulateur tvOS avec un faux fournisseur local, la pilote à la télécommande virtuelle
# et garde une capture d'écran de chaque étape (artefact « visite »). Ne touche pas à l'IPA.
on:
  push:
    branches: [appletv]
    paths: ["IPTVPerso/**", "IPTVPersoUITests/**", "ci/**", "project.yml", "Podfile", ".github/workflows/visite-tvos.yml"]
  workflow_dispatch:

jobs:
  visite:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages --quiet pillow || python3 -m pip install --user --quiet pillow || true

      - name: Projet Xcode et lecteur VLC
        run: |
          xcodegen generate
          pod install --repo-update

      - name: Simulateur Apple TV
        run: |
          xcrun simctl list runtimes | grep -i tvos || true
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys;r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='tvOS' and x['isAvailable']];print(r[-1]['identifier'])")
          DT=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys;d=[x for x in json.load(sys.stdin)['devicetypes'] if 'Apple-TV-4K-3rd' in x['identifier'] or 'Apple TV 4K (3rd' in x['name']];print(d[0]['identifier'])")
          UDID=$(xcrun simctl create prisme-tv "$DT" "$RT")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          # interface en français, comme sur ton Apple TV
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array fr
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale fr_FR
          echo "Simulateur : $DT · $RT · $UDID"

      - name: Faux fournisseur local
        run: |
          nohup python3 ci/fake_server.py 8099 > fake.log 2>&1 &
          sleep 2
          curl -s "http://127.0.0.1:8099/player_api.php?username=demo&password=demo" | head -c 200

      - name: Visite (télécommande + captures)
        run: |
          mkdir -p shots
          set -o pipefail
          TEST_RUNNER_SHOTS="$PWD/shots" xcodebuild -workspace IPTVPerso.xcworkspace -scheme IPTVPerso -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build-sim -resultBundlePath visite.xcresult \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log | grep -E "error:|Test Case|passed|failed|TEST (SUCCEEDED|FAILED)" || true
          ls -la shots | head -80

      - name: Réduire les captures
        if: always()
        run: |
          cd shots 2>/dev/null && for f in *.png; do sips -Z 1920 "$f" >/dev/null 2>&1 || true; done; ls | head -80

      - name: Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visite
          path: |
            shots
            test.log
            fake.log
