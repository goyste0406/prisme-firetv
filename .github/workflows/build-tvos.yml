name: Compiler l'appli Apple TV

on:
  push:
    branches: [appletv]
  workflow_dispatch:

jobs:
  build:
    # macos-15 (arm64) n'a jamais été attribué : on essaie plusieurs types de machines
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version de Xcode
        run: xcodebuild -version && xcrun --sdk appletvos --show-sdk-version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler pour le simulateur Apple TV
        run: |
          set -o pipefail
          xcodebuild -project IPTVPerso.xcodeproj -scheme IPTVPerso \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Préparer le projet prêt à ouvrir
        if: success()
        run: |
          mkdir -p livraison
          cp -R IPTVPerso IPTVPerso.xcodeproj livraison/
          cd livraison && zip -qr ../IPTVPerso-Xcode.zip .

      - name: Mettre à disposition le projet
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPerso-Xcode-${{ matrix.os }}
          path: IPTVPerso-Xcode.zip

      - name: Journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
