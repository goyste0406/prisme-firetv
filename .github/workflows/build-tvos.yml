name: Compiler l'appli Apple TV

on:
  push:
    branches: [appletv]
    # seulement quand l'appli elle-même change (pas le simulateur)
    paths: ["IPTVPerso/**", "project.yml", "Podfile", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Les Mac arm64 (macos-15, macos-14) ne sont jamais attribués : on utilise le Mac Intel
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version de Xcode
        run: xcodebuild -version && xcrun --sdk appletvos --show-sdk-version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Ajouter le lecteur VLC (CocoaPods)
        run: pod install --repo-update

      - name: Compiler pour l'Apple TV (sans signature)
        run: |
          set -o pipefail
          xcodebuild -workspace IPTVPerso.xcworkspace -scheme IPTVPerso -configuration Release \
            -sdk appletvos -destination 'generic/platform=tvOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} build 2>&1 \
            | tee build.log | grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Contrôle de l'identité de l'appli (Bundle ID, version, build, tvOS)
        run: |
          APP=build/Build/Products/Release-appletvos/IPTVPerso.app
          PB=/usr/libexec/PlistBuddy
          BID=$($PB -c "Print CFBundleIdentifier" "$APP/Info.plist")
          VER=$($PB -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          BLD=$($PB -c "Print CFBundleVersion" "$APP/Info.plist")
          PLAT=$($PB -c "Print CFBundleSupportedPlatforms:0" "$APP/Info.plist")
          echo "Bundle ID : $BID · Version : $VER · Build : $BLD · Plateforme : $PLAT"
          # Apparition ajoute lui-même le suffixe d'équipe (.5Q7T95F5D3) : on doit livrer exactement com.steven.iptvperso
          if [ "$BID" != "com.steven.iptvperso" ]; then echo "::error::Bundle ID inattendu ($BID) : compilation arrêtée"; exit 1; fi
          if [ "$PLAT" != "AppleTVOS" ]; then echo "::error::Plateforme inattendue ($PLAT) : compilation arrêtée"; exit 1; fi
          { echo "BID=$BID"; echo "VER=$VER"; echo "BLD=$BLD"; echo "PLAT=$PLAT"; } >> "$GITHUB_ENV"

      - name: Fabriquer le fichier .ipa
        run: |
          APP=build/Build/Products/Release-appletvos/IPTVPerso.app
          ls "$APP/Frameworks"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry prisme-AppleTV.ipa Payload
          ls -lh prisme-AppleTV.ipa

      - name: Publier la dernière version (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Version $VER (build $BLD) du $(date -u '+%d/%m/%Y %H:%M') UTC · commit ${GITHUB_SHA::7}
          Bundle ID : $BID (Apparition y ajoute ton suffixe d'équipe .5Q7T95F5D3 : même appli que celle installée, mise à jour)
          Plateforme : tvOS ($PLAT)
          À installer avec Apparition (Apple ID gratuit), à rafraîchir tous les 7 jours."
          if gh release view appletv-latest >/dev/null 2>&1; then
            gh release upload appletv-latest prisme-AppleTV.ipa --clobber
            gh release edit appletv-latest --notes "$NOTE"
          else
            gh release create appletv-latest prisme-AppleTV.ipa --target appletv --prerelease \
              --title "prisme pour Apple TV" --notes "$NOTE"
          fi

      - name: Journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
