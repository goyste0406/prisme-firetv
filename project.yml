name: IPTVPerso
options:
  bundleIdPrefix: com.steven
  deploymentTarget:
    tvOS: "17.0"
targets:
  IPTVPerso:
    type: application
    platform: tvOS
    sources: [IPTVPerso]
    info:
      path: IPTVPerso/Info.plist
      properties:
        CFBundleDisplayName: prisme
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        LSApplicationQueriesSchemes: [nflx, disneyplus, aiv, videos, mycanal, hbomax, paramountplus, youtube, arte, francetv, m6plus, tf1plus, rakutentv]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steven.iptvperso
        MARKETING_VERSION: "1.5.2"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
  IPTVPersoUITests:
    # tests de navigation et captures d'écran dans le simulateur (compilation en ligne seulement, jamais dans l'IPA)
    type: bundle.ui-testing
    platform: tvOS
    sources: [IPTVPersoUITests]
    dependencies:
      - target: IPTVPerso
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steven.iptvperso.visite
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: IPTVPerso
schemes:
  IPTVPerso:
    build:
      targets:
        IPTVPerso: all
        IPTVPersoUITests: [test]
    test:
      targets: [IPTVPersoUITests]

